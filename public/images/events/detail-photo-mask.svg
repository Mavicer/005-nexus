<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <!-- The soft fade begins at (1/3, 0) and (1/2, 1). -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="33.3333" y1="0" x2="63.3333" y2="0" gradientTransform="matrix(1 0 0.166667 1 0 0)">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#fade)"/>
</svg>
