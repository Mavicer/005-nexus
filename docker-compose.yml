# ============================================================
# 大学学习通网站 — Docker Compose
# R8 部署基线：单 VM 起步 = app + postgres
# 后续 P3 可追加 meilisearch 服务（已注释预留）
#
# 国内适配（R4）：postgres 镜像需支持 pg_jieba 扩展
#   注意：官方 postgres 镜像不含 pg_jieba。schema migration 阶段
#   若 pg_jieba 装不上，按 Agent B 指示降级 pg_trgm 并上报。
#   届时会改用自建 pg_jieba 镜像或退回 pg_trgm。
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: daxuexi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: daxuexi
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      # 扩展初始化脚本挂载点（pgcrypto 等），待 migration 阶段填充
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daxuexi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app 服务在 schema migration 完成后启用
