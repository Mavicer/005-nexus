services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_PROVIDER: blog
      BLOG_ORIGIN: https://mavicer.cc
      BLOG_SSO_SECRET: ${BLOG_SSO_SECRET:?set shared server-side SSO secret}
      APP_ORIGIN: ${APP_ORIGIN:?set public origin, e.g. https://nexus.example.org}
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
