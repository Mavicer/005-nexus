name: 赛事纠错或收录线索
description: 提供官方依据，由维护者核验后更新。
title: '赛事线索：'
body:
  - type: input
    id: event
    attributes:
      label: 赛事名称或 Nexus 链接
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: 官方规则或主办方原始链接
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 需要核对的事实与原文位置
      description: 请勿提交个人身份、联系方式、账号密码或其他隐私信息。
    validations:
      required: true
